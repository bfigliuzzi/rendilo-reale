<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <!-- Contrairement à Horde et Essaim, on NE bloque PAS le zoom : ce jeu est au
       tour par tour, il n'a aucun geste continu à protéger d'un pincement, et
       `user-scalable=no` viole WCAG 1.4.4 (redimensionnement du texte à 200 %).
       `touch-action: none` est posé sur le canvas seul, pas sur le body. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Rendilo Reale — Cerveau</title>
  <meta name="theme-color" content="#1a1030" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="/pwa-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    /* Charte violet / jaune / bleu — copie locale des hex de render/textures.ts
       (le repo duplique volontairement plutôt que de partager un thème tant
       qu'un seul jeu le consomme). Contrastes calculés sur #1a1030 :
       #fff 15.9:1 · #c9bce8 10.2:1 · #ffd23f 12.5:1 · #4cc9f0 9.5:1 — RGAA 3.2. */
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #1a1030;
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
    }

    #stage { position: fixed; left: 50%; top: 50%; }
    /* Le canvas est PUR DÉCOR : toute l'interaction passe par #overlay. */
    #stage canvas { display: block; touch-action: none; }

    #hud { position: fixed; inset: 0; pointer-events: none; }

    /* ───────── Overlay d'interaction ─────────
       Superposé au canvas et transformé EXACTEMENT comme lui (même letterbox),
       il contient de vrais <button> aux coordonnées logiques 540×960. Le canvas
       porte le visuel, le DOM porte l'interaction : on récupère gratuitement
       l'ordre de tabulation, les noms accessibles, Entrée/Espace, et un anneau
       de focus réellement visible AU-DESSUS du canvas. */
    #overlay {
      position: fixed; left: 50%; top: 50%;
      width: 540px; height: 960px;
      pointer-events: none;
    }
    /* L'overlay est transparent aux gestes, SAUF ses contrôles. Penser à `input`
       autant qu'à `button` : la palette est faite de vrais boutons radio, et les
       oublier ici la rendait injouable au doigt tout en restant parfaite au
       clavier — le genre de panne qu'un test clavier ne voit pas. */
    #overlay button, #overlay input { pointer-events: auto; }
    #overlay[hidden] { display: none; }

    /* Emplacements et pions de palette : boutons TRANSPARENTS posés sur le pion
       dessiné. La zone tactile est volontairement plus large que le pion. */
    .hit {
      position: absolute; margin: 0; padding: 0;
      background: none; border: 0; border-radius: 10px;
      color: transparent; font: inherit; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hit:focus { outline: none; }
    .hit:focus-visible { outline: 3px solid #ffd23f; outline-offset: 2px; border-radius: 12px; }

    /* Actions visibles (✓ Valider / ↩ Annuler) — dans l'overlay pour rester
       alignées sur le plateau quelle que soit l'échelle. */
    .action {
      position: absolute; margin: 0;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      height: 62px; border: 0; border-radius: 14px;
      font: inherit; font-size: 20px; font-weight: 700;
      color: #fff; background: #33235c; cursor: pointer;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.45);
      -webkit-tap-highlight-color: transparent;
    }
    .action:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
    .action.primary { background: #ffd23f; color: #1a1030; box-shadow: 0 4px 0 #8a6400; }
    .action:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
    .action:focus { outline: none; }
    .action:focus-visible { outline: 3px solid #4cc9f0; outline-offset: 3px; }

    /* Boutons de la barre du haut (menu, nouvelle partie) */
    .topbtn {
      position: absolute; margin: 0;
      width: 44px; height: 44px; border: 0; border-radius: 12px;
      font: inherit; font-size: 21px; line-height: 1;
      color: #fff; background: rgba(76, 50, 127, 0.7); cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .topbtn:active { background: #2a1d4d; }
    .topbtn:focus { outline: none; }
    .topbtn:focus-visible { outline: 3px solid #ffd23f; outline-offset: 2px; }

    /* ───────── Bandeau du chat ─────────
       aria-live assertif : le chat modifie la SAISIE EN COURS du joueur ; le
       manquer avant de valider ferait perdre un essai. C'est le seul endroit du
       jeu qui interrompt, et il est toujours annulable. */
    #hud-cat {
      position: absolute; left: 50%; transform: translateX(-50%);
      top: max(10px, env(safe-area-inset-top));
      display: none; max-width: min(88vw, 430px);
      background: rgba(12, 6, 26, 0.93); border: 2px solid #ffd23f;
      border-radius: 12px; padding: 10px 14px;
      font-size: 15px; line-height: 1.45; text-align: center;
    }
    #hud-cat.visible { display: block; animation: cat-in 0.22s ease-out; }
    @keyframes cat-in { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }

    /* ───────── Miroir pour lecteurs d'écran ─────────
       Le canvas est inaccessible par nature : cet historique en texte est ce qui
       rend la partie réellement jouable sans voir le plateau. */
    .sr-only {
      position: absolute !important;
      width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    /* ───────── Écrans (accueil, règles, succès, résultat) ───────── */
    /* Fond quasi opaque, et non translucide : le plateau qui transparaissait
       derrière le texte rendait le contraste réel imprévisible — donc
       invérifiable au regard du RGAA 3.2. */
    #ui {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: #140a26;
      overflow-y: auto;
    }
    #ui.visible { display: flex; }
    .panel {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      width: min(88vw, 390px); max-height: 94vh; overflow-y: auto;
      text-align: center; padding: 14px;
      animation: panel-in 0.28s cubic-bezier(0.2, 1.2, 0.4, 1);
    }
    @keyframes panel-in { from { opacity: 0; transform: translateY(24px) scale(0.96); } to { opacity: 1; transform: none; } }
    .panel h1 {
      margin: 0 0 4px; font-size: 44px; font-weight: 900; letter-spacing: 3px;
      line-height: 1.05; color: #ffd23f; text-shadow: 0 3px 0 #7a5500;
    }
    .panel h2 { margin: 0; font-size: 29px; font-weight: 900; letter-spacing: 1px; }
    /* Le titre reçoit le focus à chaque changement d'écran (cf. ui/screens.ts) :
       on garde un indicateur — un joueur au clavier doit voir où il a atterri —
       mais stylé, plutôt que la boîte blanche du navigateur. */
    .panel h1:focus, .panel h2:focus { outline: none; }
    .panel h1:focus-visible, .panel h2:focus-visible { outline: 3px solid #4cc9f0; outline-offset: 6px; border-radius: 8px; }
    .panel h2.win { color: #7ef29a; text-shadow: 0 0 24px rgba(126, 242, 154, 0.5); animation: pop 0.55s cubic-bezier(0.2, 1.6, 0.4, 1); }
    .panel h2.lose { color: #ff6b8a; animation: slam 0.35s ease-out; }
    @keyframes pop { 0% { transform: scale(0.2); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes slam { 0% { transform: scale(1.55); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .sub { font-size: 15px; color: #c9bce8; margin: 0; }
    .rules { font-size: 14px; line-height: 1.9; color: #e6dcff; margin: 0; text-align: left; }
    .rules kbd {
      display: inline-block; min-width: 18px; padding: 1px 5px;
      background: #33235c; border: 1px solid #6b4fa8; border-radius: 5px;
      font-family: ui-monospace, monospace; font-size: 12px;
    }

    .btn {
      width: 100%; padding: 14px 18px; border: 0; border-radius: 13px;
      font: inherit; font-size: 17px; font-weight: 700; color: #fff;
      background: #33235c; cursor: pointer;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
    }
    .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
    .btn.primary { background: #ffd23f; color: #1a1030; box-shadow: 0 3px 0 #8a6400; }
    .btn.small { width: auto; padding: 9px 16px; font-size: 13px; background: #251a45; }
    .btn.danger { background: #7f1d3d; box-shadow: 0 3px 0 #47091f; }
    .btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
    .btn:focus { outline: none; }
    .btn:focus-visible { outline: 3px solid #4cc9f0; outline-offset: 3px; }
    a.hub-link { display: inline-block; text-decoration: none; color: #c9bce8; font-size: 13px; }
    a.hub-link:focus-visible { outline: 3px solid #4cc9f0; outline-offset: 3px; border-radius: 6px; }

    .col { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .row2 { display: flex; gap: 8px; width: 100%; }
    .row2 .btn { flex: 1; }

    /* Cartes de difficulté — l'état se lit au libellé ET au glyphe, jamais à la
       seule couleur (RGAA 3.1). */
    .diff-card {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      padding: 12px 14px; border: 0; border-radius: 13px;
      font: inherit; color: #fff; background: #33235c; cursor: pointer;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
    }
    .diff-card:active { transform: translateY(2px); box-shadow: none; }
    .diff-card:focus { outline: none; }
    .diff-card:focus-visible { outline: 3px solid #4cc9f0; outline-offset: 3px; }
    .diff-card.recommended { outline: 2px solid #ffd23f; outline-offset: 1px; }
    .dc-emoji { font-size: 27px; line-height: 1; }
    .dc-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .dc-name { font-size: 17px; font-weight: 700; }
    .dc-rule { font-size: 12px; color: #c9bce8; }
    .dc-best { font-size: 12px; color: #ffd23f; }

    /* Options : cases à cocher natives, jamais de faux interrupteur */
    .opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
           background: #251a45; border-radius: 12px; padding: 11px 13px; font-size: 14px; }
    .opt input { width: 22px; height: 22px; accent-color: #ffd23f; flex: none; cursor: pointer; }
    .opt label { cursor: pointer; }
    .opt .opt-hint { display: block; font-size: 12px; color: #c9bce8; margin-top: 2px; }
    .opt input:focus-visible { outline: 3px solid #4cc9f0; outline-offset: 2px; }

    /* Succès : familles à paliers (barres) + hauts faits one-shot */
    .ach-list, .feats { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .ach { background: #251a45; border-radius: 12px; padding: 10px 12px; text-align: left; }
    .ach-head { display: flex; gap: 6px; align-items: baseline; font-size: 15px; }
    .ach-head .ach-tier { margin-left: auto; font-size: 12px; color: #c9bce8; }
    .ach-desc { font-size: 12px; color: #c9bce8; margin: 2px 0 8px; }
    .bar { height: 8px; background: #150c26; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: #ffd23f; }
    .feat {
      display: flex; align-items: center; gap: 10px; text-align: left;
      background: #251a45; border: 1px solid transparent; border-radius: 12px; padding: 10px 12px;
    }
    .feat.locked { opacity: 0.5; }
    .feat.hard { border-color: #ffd23f; } /* + libellé « ★ légende » : jamais la couleur seule */
    .feat-icon { font-size: 22px; line-height: 1; }
    .feat-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .feat-name { font-size: 14px; font-weight: 700; }
    .feat-hard { font-size: 11px; font-weight: 700; color: #ffd23f; }
    .feat-desc { font-size: 12px; color: #c9bce8; }
    .feat-line { font-size: 14px; font-weight: 700; color: #ffd23f; }

    .result-code { display: flex; gap: 8px; justify-content: center; font-size: 15px; color: #c9bce8; }
    .result-stats { font-size: 14px; color: #c9bce8; margin: 0; }
    .reset-warn { font-size: 14px; line-height: 1.5; color: #ffb3c6; }

    /* Réduction du mouvement : on coupe TOUTES les animations décoratives du DOM.
       Le pendant côté canvas est géré en JS (voir RM_PARTICLE_MUL, balance.ts) —
       une media query CSS ne peut pas atteindre les particules Pixi. */
    @media (prefers-reduced-motion: reduce) {
      .panel, .panel h2.win, .panel h2.lose, #hud-cat.visible { animation: none; }
      .action:active:not(:disabled), .btn:active:not(:disabled), .diff-card:active { transform: none; }
    }
  </style>
</head>
<body>
  <div id="stage" aria-hidden="true"></div>
  <div id="hud">
    <div id="overlay" hidden></div>
    <div id="hud-cat" aria-live="assertive" aria-atomic="true"></div>
    <div id="sr" class="sr-only">
      <p id="sr-status" aria-live="polite" aria-atomic="true"></p>
      <ol id="sr-history" aria-label="Essais précédents"></ol>
    </div>
  </div>
  <div id="ui"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
